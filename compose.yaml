# Start:        docker compose up -d --build
# Install:      docker compose exec web php bin/campanella install
# Sample data:  docker compose exec web php bin/campanella seed
# Open:         http://localhost:8080
# E-mails:      http://localhost:8025 (Mailpit catches every e-mail the site sends; since 0.1.3)
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      CAMPANELLA_DEBUG: "1"
      CAMPANELLA_DB_HOST: db
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella
      # E-mails go to Mailpit, never to the real recipients (see the mailpit service).
      CAMPANELLA_MAIL_DSN: smtp://mailpit:1025
      CAMPANELLA_MAIL_FROM: noreply@campanella.local
    volumes:
      # For development: changes to the files on your machine show up immediately.
      # In this case the vendor/ folder also comes from your machine; if it is missing, run:
      #   docker compose exec web composer install
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: campanella
      MARIADB_USER: campanella
      MARIADB_PASSWORD: campanella
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  # A mail catcher for development (MIT licensed): every e-mail the site sends ends up
  # here, readable at http://localhost:8025, and none reaches anyone.
  mailpit:
    image: axllent/mailpit:v1.30.0
    ports:
      - "127.0.0.1:8025:8025"   # only from this computer: the e-mails may hold password-reset links

volumes:
  db-data:
