; PHP settings of Campanella's Docker image (copied to /usr/local/etc/php/conf.d/).
; On another server put the same values into php.ini (or .user.ini / the hosting panel).

; Images: media.max_bytes is 10 MB; the request carries the rest of the form too.
upload_max_filesize = 16M
post_max_size = 20M

; Decoding a large photo takes about 9 bytes per pixel (a 12-megapixel one about 100 MB).
memory_limit = 256M

; Not in the response headers.
expose_php = Off
