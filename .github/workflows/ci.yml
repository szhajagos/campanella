# Automated checks and releases.
#
# - On every push and pull request: PHPStan, the documentation check, the
#   tests on every supported database (MariaDB 10.6+, MySQL 8.0+), upgrades
#   from 0.1.x and 0.2.x, the browser tests, and the installation package checked
#   as a site owner gets it (all three since 0.2.0), and the performance check
#   with 10 000 objects (since 0.3.0).
# - On a version tag (v*): an installation package including the vendor/ folder,
#   attached to the GitHub release. Can also be run manually for an existing tag
#   (Actions → CI → Run workflow, giving the tag).

name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build the release package for (e.g. v0.0.3)'
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHPStan and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - run: composer validate --no-check-publish
      - run: composer install --no-interaction --no-progress

      - name: Known vulnerabilities in the dependencies
        # Fails if a package in composer.lock has a published security advisory (since 0.1.0).
        run: composer audit --locked --no-interaction

      - name: PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Every public class and method is documented
        run: composer docs:check

      - name: Markdown links
        # Tags 0.0.3 and earlier have no link checker yet.
        run: |
          if [ -f tests/links-check.php ]; then
            php tests/links-check.php
          else
            echo "No link checker in this version, skipped."
          fi

  tests:
    name: Tests – PHP ${{ matrix.php }}, ${{ matrix.db }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        db: ['mariadb:10.6', 'mariadb:11.4', 'mysql:8.0', 'mysql:8.4']
        include:
          - php: '8.4'
            db: 'mariadb:11.4'

    services:
      db:
        image: ${{ matrix.db }}
        env:
          # The MariaDB image also accepts the MYSQL_* names.
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campanella
          MYSQL_USER: campanella
          MYSQL_PASSWORD: campanella
        ports:
          - 3306:3306

    env:
      CAMPANELLA_DB_HOST: 127.0.0.1
      CAMPANELLA_DB_PORT: 3306
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=campanella", "campanella", "campanella");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "The database did not start." >&2
          exit 1

      - name: Tests
        run: composer test

      - name: Installation and status from the command line
        run: |
          php bin/campanella install
          php bin/campanella seed
          php bin/campanella status

  upgrade:
    # A real upgrade from the oldest supported version (since 0.2.0): tests/upgrade/run.sh
    # installs 0.1.0 with content, users and an image, upgrades it to this code, and
    # checks that nothing was lost and the site works.
    # Since 0.2.0 also from the newest released 0.1.x (the same schema: nothing to do).
    # Since 0.3.0 also from 0.2.0 (the previous milestone) and from the newest 0.2.x,
    # whose site has a content model too (a Blueprint made in the admin, its objects, a
    # list with filters, a redirect, the search's index) that must survive.
    # Since 0.3.1 also from 0.3.0, the start of the 0.3.x promise; an importer is run on
    # every upgraded site. Since 0.3.2 also from 0.3.1; a file is uploaded and downloaded
    # on every upgraded site, and from 0.2.9 on the old site has a Blueprint called `file`.
    # Since 0.3.3 also from 0.3.2; components are made and shown on every upgraded site,
    # and up to 0.3.2 the old site has a Blueprint called `snippet`.
    name: Upgrade from ${{ matrix.from }} – ${{ matrix.db }}
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: 'v0.1.0', db: 'mariadb:10.6' }
          - { from: 'v0.1.0', db: 'mysql:8.0' }
          - { from: 'v0.1.5', db: 'mariadb:11.4' }
          - { from: 'v0.2.0', db: 'mysql:8.4' }
          - { from: 'v0.2.9', db: 'mariadb:10.6' }
          - { from: 'v0.2.9', db: 'mysql:8.0' }
          - { from: 'v0.3.0', db: 'mariadb:11.4' }
          - { from: 'v0.3.1', db: 'mysql:8.4' }
          - { from: 'v0.3.2', db: 'mariadb:10.6' }

    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campanella
          MYSQL_USER: campanella
          MYSQL_PASSWORD: campanella
        ports:
          - 3306:3306

    env:
      CAMPANELLA_DB_HOST: 127.0.0.1
      CAMPANELLA_DB_PORT: 3306
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella

    steps:
      - uses: actions/checkout@v5
        with:
          # The tags too: the old version is checked out from v0.1.0.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=campanella", "campanella", "campanella");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "The database did not start." >&2
          exit 1

      - name: The old version (${{ matrix.from }})
        run: git worktree add "$RUNNER_TEMP/campanella-old" "${{ matrix.from }}"

      - name: Upgrade, and check that nothing was lost
        run: bash tests/upgrade/run.sh "$RUNNER_TEMP/campanella-old"

  performance:
    # The performance check (since 0.3.0): tests/performance/run.sh fills a site with
    # 10 000 objects of a Blueprint made in the admin, then requests its busiest pages
    # (a list with visitors' filters, the admin's list with own columns and filters,
    # the search) and checks their time and number of SQL queries against limits.
    name: Performance – ${{ matrix.db }}
    if: inputs.tag == ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.6', 'mysql:8.0']

    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campanella
          MYSQL_USER: campanella
          MYSQL_PASSWORD: campanella
        ports:
          - 3306:3306

    env:
      CAMPANELLA_DB_HOST: 127.0.0.1
      CAMPANELLA_DB_PORT: 3306
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=campanella", "campanella", "campanella");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "The database did not start." >&2
          exit 1

      - name: 10 000 objects, the busiest pages within their limits
        run: bash tests/performance/run.sh

  browser:
    # The browser tests (since 0.2.0): tests/browser/run.sh installs a fresh site and
    # checks, in headless Chromium, the logins, the forgotten password, the sessions,
    # the contact form's protections and the admin pages. A protection that silently
    # stops working fails the build.
    name: Browser tests
    if: inputs.tag == ''
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campanella
          MYSQL_USER: campanella
          MYSQL_PASSWORD: campanella
        ports:
          - 3306:3306

    env:
      CAMPANELLA_DB_HOST: 127.0.0.1
      CAMPANELLA_DB_PORT: 3306
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: composer install --no-interaction --no-progress

      - name: Playwright and Chromium
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          # gdb: if PHP's built-in web server itself crashes, its backtrace is printed (since 0.3.2).
          sudo apt-get install -y -q gdb

      - name: Wait for the database
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=campanella", "campanella", "campanella");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "The database did not start." >&2
          exit 1

      - name: Browser tests
        run: bash tests/browser/run.sh
        env:
          CAMPANELLA_TEST_GDB: '1'

  package:
    # The installation package (since 0.2.0), built as the release builds it, unpacked
    # on a PHP with only the required extensions, checked (contents, licences), installed
    # from the browser, and put through the browser tests: tests/package/check.sh. A
    # release is published only if this passes.
    name: Installation package
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:11.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: campanella
          MYSQL_USER: campanella
          MYSQL_PASSWORD: campanella
        ports:
          - 3306:3306

    env:
      CAMPANELLA_DB_HOST: 127.0.0.1
      CAMPANELLA_DB_PORT: 3306
      CAMPANELLA_DB_NAME: campanella
      CAMPANELLA_DB_USER: campanella
      CAMPANELLA_DB_PASSWORD: campanella

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Skipped for tags without the package check
        id: has
        run: |
          if [ -f tests/package/check.sh ]; then echo "check=1" >> "$GITHUB_OUTPUT"; else echo "No package check in this version."; fi

      - uses: shivammathur/setup-php@v2
        if: steps.has.outputs.check == '1'
        with:
          php-version: '8.3'
          # Only what Campanella needs (README: gd for images), plus what Composer needs
          # (phar, openssl, iconv): a minimal host, no recommended extension.
          extensions: none, ctype, dom, json, mbstring, pdo, pdo_mysql, session, gd, iconv, phar, openssl, filter
          ini-values: memory_limit=128M
          coverage: none
          tools: composer

      - uses: actions/setup-python@v5
        if: steps.has.outputs.check == '1'
        with:
          python-version: '3.12'

      - name: Playwright and Chromium
        if: steps.has.outputs.check == '1'
        run: |
          python -m pip install -r tests/browser/requirements.txt
          python -m playwright install --with-deps chromium
          # gdb: if PHP's built-in web server itself crashes, its backtrace is printed (since 0.3.2).
          sudo apt-get install -y -q gdb

      - name: Wait for the database
        if: steps.has.outputs.check == '1'
        run: |
          for i in $(seq 1 60); do
            php -r 'new PDO("mysql:host=127.0.0.1;port=3306;dbname=campanella", "campanella", "campanella");' 2>/dev/null && exit 0
            sleep 2
          done
          echo "The database did not start." >&2
          exit 1

      - name: Build, unpack, check, install from the browser, browser tests
        if: steps.has.outputs.check == '1'
        run: bash tests/package/check.sh
        env:
          CAMPANELLA_TEST_GDB: '1'

  release:
    name: Release package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: [checks, tests, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, dom, gd, exif, fileinfo
          coverage: none
          tools: composer

      - name: Tag matches the code version
        run: |
          VERSION="${TAG#v}"
          CODE=$(php -r 'require "src/Core/Version.php"; echo Campanella\Core\Version::CAMPANELLA;')
          if [ "$VERSION" != "$CODE" ]; then
            echo "The tag ($TAG) does not match Version::CAMPANELLA ($CODE)." >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build the package (with the vendor/ folder)
        run: |
          NAME="campanella-$VERSION"
          # Since 0.2.0 the same script the package check (above) built and checked with.
          if [ -f tests/package/build.sh ]; then
            bash tests/package/build.sh build
            ls -l build
            exit 0
          fi
          mkdir -p build
          # git archive follows the export-ignore rules in .gitattributes.
          git archive --format=tar --prefix="$NAME/" HEAD | tar -x -C build
          composer install --working-dir="build/$NAME" --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
          (cd build && zip -qr "$NAME.zip" "$NAME" && sha256sum "$NAME.zip" > "$NAME.zip.sha256")
          ls -l build

      - name: Release notes from the CHANGELOG
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > build/notes.md
          if [ ! -s build/notes.md ]; then echo "See CHANGELOG.md." > build/notes.md; fi

      - name: GitHub release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Campanella $VERSION" --notes-file build/notes.md --verify-tag
          fi
          gh release upload "$TAG" "build/campanella-$VERSION.zip" "build/campanella-$VERSION.zip.sha256" --clobber
